# Render Blueprint for the Subtrack API.
#
# The frontend is on Vercel; this is the FastAPI backend it talks to.
#
# Gmail scans run in a dedicated, bounded executor and finish within the
# service's shutdown grace period. A paid always-on instance is required:
# Render's free services can spin down while background work is still active.
services:
  - type: web
    name: subtrack-api
    runtime: python
    plan: starter
    rootDir: subtrack-backend
    buildCommand: pip install -r requirements.txt
    # Run schema work once per deploy, not once per horizontally scaled web
    # instance. This avoids startup DDL races under load.
    preDeployCommand: python scripts/migrate.py
    # Uvicorn's default access log includes query strings. Gmail's OAuth
    # callback carries a short-lived code and state in that query, so the app
    # emits its own path-only request log instead.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log
    maxShutdownDelaySeconds: 120
    # Readiness includes a real database round-trip so a deploy cannot look
    # healthy while every signed-in page is failing.
    healthCheckPath: /health/ready
    envVars:
      # Values are deliberately not in this file — sync:false means Render
      # prompts for each one and stores it, rather than keeping secrets in git.
      - key: PYTHON_VERSION
        value: "3.13.5"

      - key: DATABASE_URL           # Neon connection string
        sync: false
      - key: SUPABASE_JWT_SECRET    # verifies tokens the frontend sends
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY      # subscription detection
        sync: false
      - key: DEMO_TOKEN_SECRET
        sync: false

      # MUST match the value used everywhere else that shares this database.
      # Refresh tokens are encrypted at rest; a different key cannot read
      # tokens written by another environment, and a fresh one silently
      # invalidates every mailbox already connected.
      - key: TOKEN_ENCRYPTION_KEY
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # This exact URL must also be registered in Google Console under
      # Credentials -> your OAuth client -> Authorised redirect URIs.
      # e.g. https://subtrack-api.onrender.com/gmail/callback
      - key: GOOGLE_REDIRECT_URI
        sync: false

      # The frontend origin. CORS blocks every request if this is wrong, and
      # the Gmail callback redirects back to the first entry.
      - key: ALLOWED_ORIGINS
        value: https://subtrack-beryl.vercel.app
      # Canonical browser URL for redirects and public links. Unlike the CORS
      # setting above, this must always contain exactly one origin.
      - key: FRONTEND_URL
        value: https://subtrack-beryl.vercel.app

      - key: ENVIRONMENT
        value: production
